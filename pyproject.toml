[project]
name = "tnm"
version = "0.1.0"
description = "TNM Staging Classifier for SMM4H-HeaRD 2026 Workshop @ ACL 2026"
readme = "README.md"
authors = [
    { name = "madrueno", email = "natalia.madruenno@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.0.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "numpy>=1.24.0",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "transformers>=5.4.0",
    "torch>=2.10.0",
    "iprogress>=0.4",
    "ipywidgets>=8.1.8",
    "word2number>=1.1",
    "retry>=0.9.2",
    "peft>=0.14.0",
    "trl>=0.19.0",
    "bitsandbytes>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]
extend-select = [
    "UP",    # pyupgrade (modern Python syntax)
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = false
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = true
